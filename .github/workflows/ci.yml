name: ci

# 只跑不需要板子的部分：语法、纯逻辑、文档与代码一致性、链接。
# 真机回归（点鼠标、看屏幕、串口）跑不了，也不该在这里假装跑。

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest        # 连接器 ctypes 直调 user32/kernel32，只能在 Windows 上导入
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖（Pillow 截图；numpy 给亮块定位）
        run: python -m pip install --upgrade pip Pillow numpy

      - name: 冒烟测试（语法 / 纯逻辑 / 文档与代码一致）
        run: python tests/smoke.py

      - name: 窗口版界面冒烟（构建窗口后立刻销毁，不进 mainloop）
        env:
          PYTHONUTF8: "1"
        run: python tests/ui_smoke.py

      - name: 窗口版输入输出边界（编码/路径/权限/异常）
        env:
          PYTHONUTF8: "1"
        run: python tests/ui_io.py

      - name: 仪表盘自检（离线拉起 hub，不碰板子）
        env:
          # runner 的默认编码是 cp1252，hub 子进程打印中文会炸
          PYTHONUTF8: "1"
        run: |
          python tests/web_selftest.py 2>&1 | Tee-Object -FilePath selftest.log
          $code = $LASTEXITCODE
          # 把失败项贴到运行页摘要上，否则日志要 admin 权限才能看
          "## 仪表盘自检" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-Content selftest.log | Where-Object { $_ -match 'FAIL|结果：' } |
            Select-Object -First 25 | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit $code

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 文档相对链接
        run: python tests/links.py
